name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Semantic version bump (major/minor/patch)"
        required: false
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "minecraft/client-bots/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            controller/requirements.txt
            inference/requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          cache-dependency-path: "minecraft/plugin/pom.xml"

      - name: Determine version
        id: version
        run: |
          BASE_VERSION="0.1.0"
          if [ -f VERSION ]; then
            BASE_VERSION="$(cat VERSION | tr -d ' \n\r')"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.version_bump }}"
          else
            BUMP="patch"
          fi

          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="$BASE_VERSION"
          else
            LAST_VERSION="${LAST_TAG#v}"
            if ! echo "$LAST_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              LAST_VERSION="$BASE_VERSION"
            fi
            MAJOR="$(echo "$LAST_VERSION" | cut -d. -f1)"
            MINOR="$(echo "$LAST_VERSION" | cut -d. -f2)"
            PATCH="$(echo "$LAST_VERSION" | cut -d. -f3)"
            if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
              MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
              MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
              PATCH="$(echo "$BASE_VERSION" | cut -d. -f3)"
            fi
            case "$BUMP" in
              major)
                MAJOR="$((MAJOR + 1))"
                MINOR="0"
                PATCH="0"
                ;;
              minor)
                MINOR="$((MINOR + 1))"
                PATCH="0"
                ;;
              *)
                PATCH="$((PATCH + 1))"
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          VERSION_WITH_BUILD="${NEW_VERSION}+${COMMIT_SHORT}"

          echo "version=${VERSION_WITH_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_WITH_BUILD}" >> "$GITHUB_ENV"
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG="## Initial Release"
            CHANGELOG="${CHANGELOG}"$'\n\n'"First automated release from CI."
          else
            CHANGELOG="$(git log "$LAST_TAG"..HEAD --oneline --no-merges | sed 's/^/- /')"
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="No changes since last release."
            fi
          fi
          mkdir -p /tmp/release
          printf '%s\n' "$CHANGELOG" > /tmp/release/CHANGELOG.md
          echo "changelog_path=/tmp/release/CHANGELOG.md" >> "$GITHUB_OUTPUT"

      - name: Build Paper Plugin (Java)
        run: |
          cd minecraft/plugin
          mvn clean package -DskipTests

      - name: Build Client Bots (Node.js)
        run: |
          cd minecraft/client-bots
          npm ci
          npm run build
          tar -czf ../client-bots-${{ env.tag }}.tar.gz -C dist .

      - name: Build Controller & Inference (Python)
        run: |
          cd controller
          pip install -r requirements.txt -t .
          cd ../inference
          pip install -r requirements.txt -t .
          cd ..
          zip -r controller-inference-${{ env.tag }}.zip controller inference database

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp /tmp/release/CHANGELOG.md release-artifacts/CHANGELOG.md || true
          cp minecraft/plugin/target/*.jar release-artifacts/ || true
          cp minecraft/client-bots-*.tar.gz release-artifacts/ || true
          cp controller-inference-*.zip release-artifacts/ || true
          echo "Artifacts collected:"
          ls -la release-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.version != '' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.tag }}"
          git push origin "${{ env.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: Release ${{ env.tag }}
          body_path: release-artifacts/CHANGELOG.md
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
